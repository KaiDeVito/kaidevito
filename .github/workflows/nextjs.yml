
# Build and deploy Next.js to GitHub Pages

name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ==========================================
  # BUILD
  # ==========================================

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Build the static website for the project Pages URL.
      - name: Build Next.js
        run: npx next build
        env:
          NEXT_PUBLIC_BASE_PATH: "/kaidevito"

      # Verify that exported images are included.
      - name: Verify exported assets
        run: |
          echo "Checking static export..."
          test -d out
          test -f out/index.html

          echo "Checking navigation images..."
          test -f out/nav/linkedin_light.png
          ls -lah out/nav/linkedin_light.png

          echo "Checking project images..."
          test -d out/projects
          find out/projects -type f | head -20

          echo "Total exported files:"
          find out -type f | wc -l

          echo "Asset verification successful!"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # ==========================================
  # DEPLOYMENT
  # ==========================================

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
